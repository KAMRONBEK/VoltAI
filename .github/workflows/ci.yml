name: CI

# Push-to-deploy for a backend nothing can reach in: the `check` job verifies every push/PR; on a
# green push to `main` the `publish-api` job builds the API and publishes it as a GitHub Release
# tagged `api-<shortsha>`. The phone's `voltai-updater` service polls the latest release every
# 5 min, verifies the checksum, applies it (apps/api/scripts/termux/apply-update.sh: npm ci if the
# lockfile changed → restart → smoke test) and rolls back on failure. See apps/api/RUNBOOK.md §3.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint (api, mobile, web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (root lockfile, all workspaces)
        run: npm ci --no-audit --no-fund

      # API: the merge/plan checks need the (gitignored) SQLite catalog, so CI runs the compiler
      # and the build (incl. the version stamp) — the data checks stay in `npm run lint` locally.
      - name: API — tsc + build
        run: |
          npx tsc -p apps/api/tsconfig.json --noEmit
          npm run build -w voltai-api

      - name: Mobile — tsc + expo lint
        run: |
          cd apps/mobile
          npx tsc --noEmit
          npx expo lint

      - name: Web — lint + typecheck
        run: |
          cd apps/web
          npx tsc --noEmit
          npm run lint

      # Shell scripts shipped to the phone must stay LF and syntactically valid.
      - name: Phone scripts — bash -n + LF check
        run: |
          set -e
          for f in apps/api/scripts/termux/*.sh apps/api/scripts/*.sh apps/api/scripts/phone/*.sh; do
            bash -n "$f"
            if grep -q $'\r' "$f"; then echo "CRLF line endings in $f" >&2; exit 1; fi
          done

  publish-api:
    name: publish API bundle (GitHub Release → phone auto-updates)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Only publish (and therefore restart the phone) when the API can actually differ: anything
      # under apps/api, or the root package files. Docs/mobile/web-only pushes are skipped.
      - name: Did this push touch the API?
        id: changed
        run: |
          if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(apps/api/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"; echo "no API changes in this push — not publishing"
          fi

      - uses: actions/setup-node@v5
        if: steps.changed.outputs.api == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.changed.outputs.api == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build API (tsc + dist/version.json stamp)
        if: steps.changed.outputs.api == 'true'
        run: npm run build -w voltai-api

      - name: Bundle (same layout deploy.sh ships)
        id: bundle
        if: steps.changed.outputs.api == 'true'
        run: |
          set -e
          SHORT="$(node -p "require('./apps/api/dist/version.json').commit")"
          NAME="voltai-api-$SHORT"
          tar -czf "$NAME.tar.gz" \
            package.json package-lock.json \
            apps/api/package.json apps/api/dist apps/api/scripts apps/api/docs apps/api/.env.example \
            apps/api/apps.json apps/api/RUNBOOK.md
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          ls -la "$NAME.tar.gz" "$NAME.tar.gz.sha256"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release api-<sha> (marked latest)
        if: steps.changed.outputs.api == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.bundle.outputs.short }}
          NAME: ${{ steps.bundle.outputs.name }}
          FULL_SHA: ${{ github.sha }}
          # Passed through the environment on purpose: a commit message interpolated straight into
          # the shell script would be EXECUTED (backticks / $(...)), not just printed.
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          TAG="api-$SHORT"
          {
            printf 'Built by CI from %s.\n\n' "$FULL_SHA"
            printf '%s\n\n' "$HEAD_MSG"
            printf '%s\n' "The phone's voltai-updater applies this automatically; manual: bash apps/api/scripts/termux/apply-update.sh <bundle>."
          } > release-notes.md
          # Re-runs of the same commit replace the release instead of failing.
          gh release delete "$TAG" -y --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$NAME.tar.gz" "$NAME.tar.gz.sha256" \
            --title "API build $SHORT" --latest --notes-file release-notes.md
          echo "published $TAG"

      - name: Prune old api-* releases (keep the newest 10)
        if: steps.changed.outputs.api == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("api-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | xargs -r -n1 -I{} gh release delete {} -y --cleanup-tag
