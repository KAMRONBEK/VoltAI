name: Reusable App Scraper

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      GRIZZLYSMS_API_KEY: ${{ secrets.GRIZZLYSMS_API_KEY }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          npm install -g appium
          appium driver install uiautomator2
          python -m pip install --upgrade pip
          pip install mitmproxy

      - name: Start mitmproxy
        run: mitmdump --set hardump=./traffic.har -p 8080 &

      - name: Run scraper in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -http-proxy http://127.0.0.1:8080
          script: |
            npm run scrape:app -- "${{ inputs.app_name }}"

      - name: Upload HAR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-${{ inputs.app_name }}
          path: traffic.har
          if-no-files-found: ignore
