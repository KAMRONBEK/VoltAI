name: Scrape Yandex Maps

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run scrape:yandex
