# Cloudflare Tunnel config for serving the phone-hosted API at https://api.voltai.uz
# — LOCALLY-MANAGED tunnel variant. (The simpler REMOTELY-MANAGED variant needs no config file at
# all: create the tunnel in Zero Trust → Networks → Tunnels, add the public hostname
# api.voltai.uz → http://127.0.0.1:8080 there, and put the connector token in
# ~/.cloudflared/token on the phone; the runit service picks that up first. See RUNBOOK §4.)
#
# Copy to ~/.cloudflared/config.yml on the phone and fill in <TUNNEL-UUID>.
# Requires the voltai.uz DNS zone to be on Cloudflare (RUNBOOK §Gate 2).

tunnel: <TUNNEL-UUID>
credentials-file: /data/data/com.termux/files/home/.cloudflared/<TUNNEL-UUID>.json

# Never let cloudflared self-replace the working bionic/arm64 binary.
no-autoupdate: true
# Android has no /etc/resolv.conf; force IPv4 edge + HTTP2 to avoid the "SRV lookup on
# [::1]:53 refused" failure and carrier QUIC/UDP throttling.
protocol: http2
edge-ip-version: 4
loglevel: info

ingress:
  # Belt and braces: the API itself already 404s any /ingest request that arrives through the
  # tunnel (cf-connecting-ip present) or from a non-loopback peer. Case-insensitive on purpose —
  # Express routing is case-insensitive, Go regexps are not.
  - hostname: api.voltai.uz
    path: (?i)^/ingest
    service: http_status:404
  - hostname: api.voltai.uz
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 10s
  - service: http_status:404
